name: Generate M3U Playlist

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *' # Se ejecuta cada 5 minutos

jobs:
  build:
    runs-on: ubuntu-latest

    # IMPORTANTE: Conceder permisos explícitos al token en el job
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi

      - name: Run Python script
        run: python generate_m3u.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add eventos.m3u
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update eventos.m3u [skip ci]" && git push)
