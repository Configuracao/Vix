name: Actualizar Agenda JSON

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *' # Se ejecuta automáticamente cada 30 minutos

permissions:
  contents: write

jobs:
  update-agenda:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar dependencias
        run: pip install requests

      - name: Procesar Agenda JSON
        run: python procesar_agenda.py

      - name: Guardar cambios en GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add agenda.json
          git commit -m "Agenda actualizada" || exit 0
          git push
