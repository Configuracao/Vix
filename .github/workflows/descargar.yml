name: Descargar y Guardar en Assets

on:
  workflow_dispatch:

permissions:
  contents: write # Permite a GitHub Actions subir cambios al repositorio

jobs:
  download_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar dependencias
        run: pip install requests

      - name: Descargar imágenes
        run: python descargar.py

      - name: Subir cambios a GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          git commit -m "Descarga de imágenes en carpeta assets" || exit 0
          git push
