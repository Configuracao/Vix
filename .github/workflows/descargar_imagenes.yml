name: Descargar Nuevas Imagenes

on:
  workflow_dispatch: # Solo se ejecuta manualmente con botón

permissions:
  contents: write

jobs:
  download-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar dependencias
        run: pip install requests

      - name: Descargar Imágenes
        run: python descargar.py

      - name: Guardar Imágenes en GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/
          git commit -m "Nuevas imágenes agregadas" || exit 0
          git push
